name: Manual cloud backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-cloud-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --omit=dev
      - name: Use PostgreSQL 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | grep -q 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/fleet-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Encrypt and verify database and evidence backup
        run: |
          node scripts/cloud-backup.js
          node scripts/cloud-backup-verify.js
        env:
          BACKUP_RESULT_FILE: ${{ runner.temp }}/fleet-backup-result.json
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_SOURCE_ACCESS_KEY_ID: ${{ secrets.BACKUP_SOURCE_ACCESS_KEY_ID }}
          BACKUP_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SOURCE_SECRET_ACCESS_KEY }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://10b5b0c9fe20ad7915d5f37189f0715f.r2.cloudflarestorage.com
          R2_BUCKET: fleet-checkout-evidence
          BACKUP_BUCKET: fleet-checkout-backups
